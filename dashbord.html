<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Smart Donation</title>
    <link rel="stylesheet" href="styles.css"> <!-- your CSS file -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            height: 100vh;
            width: 220px;
            background-color: #2c3e50;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 16px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }
        .main {
            margin-left: 220px;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:white; text-align:center;">Admin Panel</h2>
    <a href="/admin/users">Manage Users</a>
    <a href="/admin/ngos">Manage NGOs</a>
    <a href="/admin/donations">View Donations</a>
    <a href="/logout">Logout</a>
</div>

<div class="main">
    <h1>Welcome, Admin</h1>

    <div class="card">
        <h2>Users</h2>
        <p>View, Approve, or Block Users</p>
        <a href="/admin/users" class="btn">Manage Users</a>
    </div>

    <div class="card">
        <h2>NGOs</h2>
        <p>View, Approve, or Remove NGOs</p>
        <a href="/admin/ngos" class="btn">Manage NGOs</a>
    </div>

    <div class="card">
        <h2>Donations</h2>
        <p>Track all donations in the system</p>
        <a href="/admin/donations" class="btn">View Donations</a>
    </div>
</div>

</body>
</html>
